services:
  mongodb:
    image: mongo:latest
    container_name: bewell_mongodb
    volumes:
      - bewell_mongo_data:/data/db

  backend:
    build:
      context: ./server
    container_name: bewell_backend
    environment:
      - MONGO_URI=mongodb://mongodb:27017/bewell
      - JWT_SECRET=${JWT_SECRET:-BewellSuperSecretKey2026}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/data:/app/data
    depends_on:
      - mongodb
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: bewell_ollama
    volumes:
      - bewell_ollama_data:/root/.ollama
    # Entrypoint override to pull the model on startup, then start the server
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull tinyllama && wait"]

  frontend:
    build:
      context: ./client
    container_name: bewell_frontend
    ports:
      - "7345:3000"
    environment:
      - NEXT_INTERNAL_API_URL=http://backend:3001
    depends_on:
      - backend

volumes:
  bewell_mongo_data:
  bewell_ollama_data:
